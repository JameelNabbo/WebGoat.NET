name: Offensive 360 SAST Scan

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  sast-scan:
    runs-on: [self-hosted, linux, x64, DC]

    steps:
      - name: Validate runner tools
        run: |
          set -e
          command -v git >/dev/null 2>&1 || { echo "git is required"; exit 1; }
          command -v tar >/dev/null 2>&1 || { echo "tar is required"; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "curl is required"; exit 1; }

      - name: Fetch repository without actions/checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SRC_DIR="$RUNNER_TEMP/o360-src"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"

          git init
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"

          git -c http.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" \
            fetch --depth=1 origin "${{ github.sha }}"

          git checkout --detach FETCH_HEAD

      - name: Create archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/o360-src"
          git archive --format=tar --output="$RUNNER_TEMP/source.tar" HEAD
          ls -lh "$RUNNER_TEMP/source.tar"

      - name: Submit to Offensive 360
        env:
          O360_API_KEY: ${{ secrets.O360_API_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sk -o /tmp/o360_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $O360_API_KEY" \
            -F "FileSource=@$RUNNER_TEMP/source.tar" \
            -F "Name=${{ github.event.repository.name }}" \
            -F "ExternalScanSourceType=5" \
            -F "DontWaitForScanToComplete=true" \
            -F "AllowDependencyScan=true" \
            -F "AllowLicenseScan=true" \
            -F "AllowMalwareScan=true" \
            -F "PipelineUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://o360.madfoat.com/app/api/ExternalScan")

          cat /tmp/o360_resp.json
          test "$HTTP_CODE" = "200" || test "$HTTP_CODE" = "201"

      - name: View results
        if: always()
        run: |
          echo "Results: https://o360.madfoat.com/Projects"
