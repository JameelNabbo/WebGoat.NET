# Vulnerable Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
      - name: app
        image: myapp
        securityContext:
          privileged: true
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
            - NET_ADMIN
            - ALL
        env:
        - name: DB_PASSWORD
          value: "SuperSecret123!"
        - name: API_KEY
          value: "sk-1234567890abcdef"
        - name: SECRET_KEY
          value: "my-secret-key-value-here"
        ports:
        - containerPort: 8080
      volumes:
      - name: secret-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-svc
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: kubernetes-dashboard
  ports:
  - port: 443
    targetPort: 8443
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: too-permissive
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
